name: Release

on:
  release:
    types: [published]
  # A manual run builds the installers and keeps them as run artifacts,
  # without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            asset: dist/SpeechDictation-Setup.exe
          - os: macos-latest
            label: macOS
            asset: dist/SpeechDictation-macos.dmg
          # Pinned, so the build machine changes only when we move it.
          - os: ubuntu-24.04
            label: Linux
            asset: dist/SpeechDictation-linux.tar.gz
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check version matches tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          app=$(python -c "import re;print(re.search(r'\"(.+?)\"', open('speech_dictation/__init__.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "speech_dictation/__init__.py is $app but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 libnss3 libx11-dev xvfb
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: winget install --id JRSoftware.InnoSetup -e --accept-source-agreements --accept-package-agreements --disable-interactivity

      - name: Install build tools
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build installer
        if: runner.os != 'Linux'
        run: python packaging/build.py

      - name: Build installer
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/build.py

      - name: Keep installer
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Publish installer
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
