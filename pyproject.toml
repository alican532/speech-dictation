[project]
name = "speech-dictation"
version = "2.0.0"
description = "Tray dictation and translation with Groq Whisper or Gemini Live."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "certifi>=2024.0.0",
    "pynput>=1.7.6; sys_platform != 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.14"]

[project.scripts]
speech-dictation = "speech_dictation.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["speech_dictation*"]
